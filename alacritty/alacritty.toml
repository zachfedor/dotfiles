# Alacritty - TOML configuration file format.

[general]
# Generated by scripts/theme-switch (issue 08 / ADR-0009); never hand-edited.
import = ["~/.config/alacritty/colors.toml"]
live_config_reload = true

[window]
padding = { x = 20, y = 20 }
dynamic_padding = true
decorations = "Buttonless"
opacity = 1

[font]
normal= { family = "Hack Nerd Font Mono", style = "Regular" }
offset= { x = 1, y = 3 }
size=16

[selection]
save_to_clipboard = true
